<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>What to Wear? — SVG Asset Gallery</title>
    <link rel="stylesheet" href="asset-gallery.css">
    <script type="module" src="asset-gallery.js"></script>
  </head>
  <body>
    <header>
      <p class="eyebrow">Development-only visual check</p>
      <h1>Original SVG asset gallery</h1>
      <p>All artwork is code-native, original to this prototype, and credited to xiaoyuex_x.</p>
    </header>
    <main>
      <section aria-labelledby="outfit-title">
        <div class="section-heading">
          <div>
            <p class="eyebrow">90 assembled entries</p>
            <h2 id="outfit-title">Character and outfit coverage</h2>
          </div>
          <label>Filter
            <select data-gallery-filter>
              <option value="all">All outfits</option>
              <option value="crop">Cropped character</option>
              <option value="curls">Curls character</option>
              <option value="waves">Long waves character</option>
              <option value="bob">Soft bob character</option>
            </select>
          </label>
        </div>
        <div class="outfit-grid" data-outfit-gallery></div>
      </section>
      <section aria-labelledby="icon-title">
        <p class="eyebrow">Weather, reminders, and states</p>
        <h2 id="icon-title">Icon coverage</h2>
        <div class="icon-grid" data-icon-gallery></div>
      </section>
    </main>
  </body>
</html>
